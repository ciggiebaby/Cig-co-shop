[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Printful thank-you email: hourly sweep for "shipped + THANKYOU_DELAY_DAYS"
# sends and retries. Does nothing unless THANKYOU_EMAIL_ENABLED=true.
[functions."thankyou-email-sweep"]
  schedule = "@hourly"

# Google Merchant Center fetches this feed on a schedule (scripts/build-product-pages.js).
[[headers]]
  for = "/google-feed.tsv"
  [headers.values]
    Content-Type = "text/tab-separated-values; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
